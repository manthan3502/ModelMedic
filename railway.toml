# Public read-only web service only. Configure private database/bucket/env in Railway.
# Migration and synthetic seed are explicit operator steps; never auto-seed on startup.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["alembic upgrade head"]
startCommand = "python -m backend.app.web"
healthcheckPath = "/api/v1/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
