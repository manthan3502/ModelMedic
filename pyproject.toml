[project]
name = "modelmedic"
version = "0.0.0"
description = "ModelMedic baseline dataset setup"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "pyarrow>=21,<22",
  "scikit-learn==1.7.2",
  "numpy==2.3.3",
  "scipy==1.16.2",
  "pandas==2.3.3",
  "joblib==1.5.2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["integration: requires a disposable PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app", "migrations"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true
